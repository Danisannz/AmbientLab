name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -A x64 -DAMBIENT_BUILD_SNAPSHOT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Processor self test (real bus layouts, both targets)
        shell: pwsh
        run: |
          $tools = @("AmbientSnapshot", "AmbientSnapshotFX")
          foreach ($t in $tools) {
            $exe = Get-ChildItem -Path build -Recurse -Filter "$t.exe" | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
            Write-Host "== $t =="
            & $exe.FullName --selftest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: Validate plugins (pluginval, strictness 10)
        shell: pwsh
        run: |
          $plugins = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 | Where-Object { $_.FullName -match 'Release' }
          foreach ($p in $plugins) {
            Write-Host "Validating $($p.FullName)"
            $out = & ./pluginval/pluginval.exe --strictness-level 10 --skip-gui-tests --output-dir pluginval-logs --validate "$($p.FullName)" 2>&1 | Out-String
            Write-Host $out
            # pluginval can return a non-zero code on exit even after passing; judge by its verdict.
            if ($out -notmatch 'SUCCESS') { Write-Host "pluginval FAILED for $($p.Name)"; exit 1 }
          }
          exit 0

      - name: Upload VST3 plugins
        uses: actions/upload-artifact@v4
        with:
          name: AmbientLab-VST3-Windows
          path: |
            build/plugin/AmbientLabInstrument_artefacts/Release/VST3/
            build/plugin/AmbientLabFX_artefacts/Release/VST3/

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs
